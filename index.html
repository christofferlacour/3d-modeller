<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modulær skiltsøjle</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; --scene-color: #cccccc; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--scene-color);
      font-family: system-ui, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: var(--scene-color);
      --poster-color: var(--scene-color);
    }
    .controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .5rem;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 6px;
      background: rgb(20 27 27 / 78%);
      opacity: 0;
      transition: opacity .2s ease;
    }
    .fullscreen {
      position: fixed;
      top: 1rem;
      left: 1rem;
      padding: .6rem .75rem;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 6px;
      color: #fff;
      background: rgb(20 27 27 / 78%);
      cursor: pointer;
      font: inherit;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .picker {
      width: 1.8rem;
      height: 1.8rem;
      padding: 0;
      border: 2px solid rgb(255 255 255 / 75%);
      border-radius: 50%;
      cursor: pointer;
      background: var(--scene-color);
    }
    .picker { overflow: hidden; }
    .picker input {
      width: 3rem;
      height: 3rem;
      margin: -.6rem;
      cursor: pointer;
      opacity: 0;
    }
    .hint {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      padding: .55rem .8rem;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 6px;
      color: #fff;
      background: rgb(20 27 27 / 78%);
      font-size: .85rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    body:hover .controls,
    body:hover .fullscreen,
    body:hover .hint,
    .controls:hover,
    .fullscreen:hover { opacity: 1; }
  </style>
</head>
<body>
  <model-viewer
    src="Multiposted%20Modular%20Sign.glb"
    alt="Interactive 3D model of a modular sign pillar"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="0.8"
    shadow-softness="0.7"
    exposure="0.85"
    environment-image="neutral"
    interaction-prompt="auto"
    loading="eager">
  </model-viewer>
  <div class="controls" aria-label="Background color">
    <label class="picker" aria-label="Choose a background color" title="Change background color">
      <input id="color-picker" type="color" value="#cccccc">
    </label>
  </div>
  <button class="fullscreen" id="fullscreen" type="button">Fullscreen</button>
  <div class="hint">Drag to rotate · Scroll to zoom</div>
  <script>
    const viewer = document.querySelector('model-viewer');
    const root = document.documentElement;
    const picker = document.querySelector('#color-picker');
    const fullscreenButton = document.querySelector('#fullscreen');

    function setSceneColor(color) {
      root.style.setProperty('--scene-color', color);
      picker.value = color;
    }

    picker.addEventListener('input', () => {
      setSceneColor(picker.value);
      document.querySelector('.picker').style.background = picker.value;
    });
    fullscreenButton.addEventListener('click', () => {
      const target = document.querySelector('model-viewer');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (target.requestFullscreen) {
        target.requestFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });
    setSceneColor('#b52c36');
  </script>
</body>
</html>
